name: Build and Call reusable Deploy

on:
  workflow_dispatch:

jobs:
  build-job:
    runs-on: windows-latest # la machine virtuel qu'on veut utiliser

    steps:

      - name: checkout code
        uses: actions/checkout@v4.1.7 # permet de télécharger notre code sur la machine virtuel que l'on a choisit juste au dessus 

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4.0.1 # installe SDK .net pour pouvoir compiler les fichier et utiliser le langage approprié
        with:
          dotnet-version: '8.x'

      - name: Build code
        run: dotnet build --configuration Release

      - name: Publish code
        run: dotnet publish -c Release --property:PublishDir="${{env.DOTNET_ROOT}}\myapp"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.3.6 # permet de faire des artifact et réutiliser les résultats plus tard
        with:
          # Artifact name
          name: .net-app
          path: ${{env.DOTNET_ROOT}}\myapp
    
  call-reusable-deployment-workflow-job:
     needs: build-job

     uses: Rainsy467/shared-workflows/.github/workflows/reusable-deploy-shared-repo.yml@main
     with:
       package-name: .net-app # nom de l'artécfact que nous allons utiliser
       app-name: appsvc1
       deployment-slot: development
     secrets: 
       azure-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
